plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.downloaderpro.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.downloaderpro.app'
        minSdk 26
        targetSdk 35
        versionCode 30
        versionName '3.0'
    }
    buildTypes { release { minifyEnabled false }; debug { minifyEnabled false } }
}
python { version '3.11'; pip { install 'yt-dlp' } }
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.13.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-full:8.1.8'
}
